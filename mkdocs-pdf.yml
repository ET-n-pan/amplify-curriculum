site_name: "AWS Amplify Gen2 学習カリキュラム (Day 1-6)"
site_description: "Guide for AWS Amplify development using Vue.js 3 with TypeScript, UI5 Web Components - Days 1 through 6"
site_author: "Nilei Pan"

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - typescript
    - javascript
    - bash
    - json

nav:
  - ホーム: index.md
  - 準備:
    - Day 1 - キックオフ & セットアップ: foundation/day01-kickoff-setup.md
    - Day 2 - Amplify Gen2基礎: foundation/day02-amplify-gen2-basics.md
    - Day 3 - Authentication (Cognito): foundation/day03-authentication.md
  - UI開発:
    - Day 4 - UI5 Web ComponentsをVueで利用(試作)①: ui-development/day04-ui5-components-1.md
    - Day 5 - UI5 Web ComponentsをVueで利用(試作)②: ui-development/day05-ui5-components-2.md
    - Day 6 - AG Gridを使ったExcelライクな画面表現を試作: ui-development/day06-ag-grid.md

plugins:
  - search:
      lang: ja
  - with-pdf:
      author: "for internal use only"
      cover: true
      cover_title: "AWS Amplify Gen2 学習カリキュラム (Day 1-6)"
      cover_subtitle: ""
      back_cover: false
      output_path: "amplify-curriculum-day1-6.pdf"
      enabled_if_env: ENABLE_PDF_EXPORT
      debug_html: false
      show_anchors: false
      verbose: false
      render_js: false
      toc_title: "目次"
      heading_shift: false
      toc_level: 3
      ordered_chapter_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: "On this page"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
